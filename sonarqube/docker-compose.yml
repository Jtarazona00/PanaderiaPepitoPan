# ===========================================================================
# Entorno de SonarQube como Infraestructura como Código.
# Levanta el servidor SonarQube (web en el puerto 9000) y su base de datos
# PostgreSQL. Este mismo archivo se usa en local y dentro del pipeline de CI.
#
# Uso local:
#   cd sonarqube
#   docker compose up -d
#   docker compose logs -f sonarqube   # esperar "SonarQube is operational"
#   http://localhost:9000  (admin / admin -> cambiar contraseña)
# ===========================================================================

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
