# Promtail: lee los 3 archivos de log y los envía a Loki, etiquetando cada uno
# con su servicio (app / database / auth).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pedidos-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: pedidos
          service: app
          __path__: /logs/app.log
      - targets: [localhost]
        labels:
          job: pedidos
          service: database
          __path__: /logs/database.log
      - targets: [localhost]
        labels:
          job: pedidos
          service: auth
          __path__: /logs/login.log
