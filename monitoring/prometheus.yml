# Configuración de Prometheus: scrapea las métricas de la app cada 5s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'pedidos-app'
    static_configs:
      - targets: ['app:4002']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
