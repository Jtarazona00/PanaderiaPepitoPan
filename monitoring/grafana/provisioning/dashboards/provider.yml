# Provider de dashboards: carga los JSON de /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: 'Pedidos'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
