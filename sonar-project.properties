# Configuración del análisis de SonarQube (SonarScanner CLI).
# Identificador del proyecto (debe coincidir con el Project key en SonarQube)
sonar.projectKey=panaderia-pepito-pan
sonar.projectName=Panaderia Pepito Pan
sonar.projectVersion=1.0

# Código a analizar: la infraestructura Terraform y el código de las Lambdas
sonar.sources=iac

# Codificación de los archivos
sonar.sourceEncoding=UTF-8

# Servidor SonarQube (para análisis local; en CI se pasa por variable de entorno)
sonar.host.url=http://localhost:9000
